name: Feature request
description: Suggest an addition (a transform, a plugin, a command, a docs page)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first; the solution can follow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like pmlab to do?
      description: "Mind the [public API promise](https://pmlab.hiddenterps.si/api-stability/). Additions are welcome; changes to existing names need a deprecation."
