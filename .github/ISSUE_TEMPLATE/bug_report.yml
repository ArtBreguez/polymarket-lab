name: Bug report
description: Something pmlab does is wrong or crashes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue: see [SECURITY.md](https://github.com/ArtBreguez/polymarket-lab/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest code or command that shows it. The bundled sample (`pmlab.datasets.load_sample()`) works offline.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pmlab version
      description: The output of `pmlab version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
