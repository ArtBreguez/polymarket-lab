# Weekly update PRs for what CI actually installs: the uv lockfile and the pinned GitHub Actions.
# Grouped, so a week of bumps is one PR to review and not a dozen.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
