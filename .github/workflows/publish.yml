name: Publish to PyPI

# Fully automatic release on merge to main: when the version in pyproject.toml
# is bumped (i.e. no git tag exists for it yet), this workflow runs the full CI
# gate, publishes to PyPI, and creates the git tag + GitHub Release in one run.
# If the version already has a tag, every step is skipped — so ordinary merges
# that don't bump the version are no-ops.
#
# Single-workflow design is deliberate: a tag created by the default GITHUB_TOKEN
# does NOT trigger a separate tag-triggered workflow (GitHub anti-recursion rule),
# so an auto-tag -> publish chain would silently never publish. Doing everything
# in this one push-to-main run avoids that trap and needs no extra PAT secret.

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publisher
      contents: write  # required to create the tag + GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history + tags for the version guard

      - name: Resolve version and check for existing tag
        id: guard
        run: |
          version="$(grep '^version' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version already tagged — skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is new — running release."
          fi

      - name: Set up Python
        if: steps.guard.outputs.should_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.guard.outputs.should_release == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        if: steps.guard.outputs.should_release == 'true'
        run: uv sync --extra dev

      - name: Lint (ruff)
        if: steps.guard.outputs.should_release == 'true'
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        if: steps.guard.outputs.should_release == 'true'
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        if: steps.guard.outputs.should_release == 'true'
        run: uv run mypy src/

      - name: Run tests
        if: steps.guard.outputs.should_release == 'true'
        run: uv run pytest --cov=src/pmlab --cov-fail-under=70

      - name: Build wheel + sdist
        if: steps.guard.outputs.should_release == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.guard.outputs.should_release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create tag + GitHub Release
        if: steps.guard.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.guard.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.whl
            dist/*.tar.gz
