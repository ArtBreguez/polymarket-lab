name: CI

"on":
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=src/pmlab \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage report summary
        if: always()
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          uv run python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          cov = float(root.attrib.get('line-rate', 0)) * 100
          print(f'| Metric | Value |')
          print(f'|--------|-------|')
          print(f'| Line coverage | {cov:.1f}% |')
          " >> $GITHUB_STEP_SUMMARY || true

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel + sdist
        run: uv build

      - name: Verify dist contents
        run: ls -la dist/

  # ── Security ───────────────────────────────────────────────────────────
  # SCA + SAST + secret-scanning, mirroring the backtesting-framework CI so both
  # repos share one security bar. pmlab publishes to PyPI, so the supply-chain
  # surface (deps) and any committed secret matter.

  deps-audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Export locked dependencies
        # Audit the fully-resolved, pinned set (what users actually install),
        # not the loose ranges in pyproject.
        run: uv export --format requirements-txt --no-emit-project > requirements-audit.txt

      - name: Audit dependencies for known CVEs
        # Fails on any known vulnerability. If a vuln has no upstream fix and is
        # assessed as not-exploitable in our usage, add a documented
        # `--ignore-vuln <ID>` here with a comment explaining why.
        run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff the PR/push range
      # Run the gitleaks CLI directly, NOT gitleaks/gitleaks-action@v2: that
      # action requires a paid GITLEAKS_LICENSE for GitHub organizations and
      # hard-fails without one. The binary is Apache-2.0 and unrestricted.
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # Scan only the commits introduced by THIS push/PR, not full history.
      # Range: base..head for PRs, before..after for pushes.
      - name: Scan new commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base ref (first push) — scanning HEAD commit only."
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "Scanning range: $RANGE"
          gitleaks git --log-opts="$RANGE" --redact --verbose --exit-code 1

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Run bandit
        # -r recursive over the package; -ll = report only medium+ severity to
        # keep signal high. Config (tool.bandit in pyproject) documents the one
        # suppression (B301 pickle — model persistence by design). Blocking (no
        # --exit-zero): the baseline is clean, so keep it clean.
        run: uvx --from "bandit[toml]" bandit -c pyproject.toml -r src -ll
