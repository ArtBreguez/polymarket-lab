name: Docs

# Builds the documentation site with `mkdocs build --strict` and publishes it to GitHub Pages.
#
#   push to main (docs, source, config)  ->  build, then deploy
#   manual dispatch                      ->  build, then deploy
#   pull request                         ->  build only: the check that a change does not break the
#                                            site (broken link, missing anchor, unrenderable entry)
#
# Pages is set to "GitHub Actions" as its source (Settings -> Pages, or the API). The site URL is
# https://pmlab.hiddenterps.si/ . Every action is pinned to a commit SHA.

"on":
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/griffe_deprecated.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "scripts/griffe_deprecated.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"  # silences the MkDocs 2.0 / Material end-of-life banner in the log

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install the docs extra
        run: uv sync --extra docs

      # --strict: a warning (broken link, missing anchor, a page outside the nav, an API entry
      # that cannot be rendered) fails the job instead of shipping.
      - name: Build the site
        run: uv run mkdocs build --strict

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Never on a pull request: a PR only proves the site builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploys queue instead of cancelling each other: a half-finished deploy is worse than a late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
